<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Buscador Inteligente PHP + Gemini</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            max-width: 750px;

            margin: 40px auto;

            padding: 0 20px;

            color: #333;

            background: #fafafa;
        }


        h1 {
            margin-bottom: 5px;
        }


        .descripcion {

            color: #666;

            margin-bottom: 25px;
        }


        .buscador-contenedor {

            display: flex;

            gap: 10px;

            margin-bottom: 20px;
        }


        input {

            flex: 1;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }


        input:focus {

            border-color: #2a75d3;
        }


        button {

            padding: 14px 25px;

            background: #2a75d3;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            font-size: 15px;
        }


        button:hover {

            background: #1c5fa3;
        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        #status {

            display: none;

            margin-bottom: 20px;

            padding: 15px;

            background: #f4f4f9;

            border-left: 4px solid #2a75d3;

            border-radius: 6px;

            font-size: 14px;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }


        #status.error {

            background: #fff0f0;

            border-left-color: #d32f2f;

            color: #a00000;
        }


        #status.exito {

            background: #effff3;

            border-left-color: #1b8a3c;

            color: #145d2b;
        }


        .producto {

            padding: 18px;

            margin-bottom: 12px;

            border: 1px solid #e3e3e3;

            border-radius: 10px;

            background: white;

            box-shadow:
                0 2px 7px rgba(0, 0, 0, 0.05);
        }


        .producto h3 {

            margin-top: 0;

            margin-bottom: 8px;
        }


        .producto p {

            margin: 4px 0;

            color: #555;
        }


        .sin-resultados {

            padding: 20px;

            background: white;

            border-radius: 8px;

            border: 1px solid #ddd;
        }


        @media (max-width: 600px) {

            .buscador-contenedor {

                flex-direction: column;
            }


            button {

                width: 100%;
            }
        }

    </style>

</head>


<body>


    <h1>Buscador Inteligente</h1>


    <p class="descripcion">

        Prueba escribiendo:

        <br><br>

        <b>laptop negra de menos de 600</b>

        <br>

        <b>telefono blanco</b>

        <br>

        <b>telefono de menos de 900</b>

    </p>


    <div class="buscador-contenedor">

        <input
            type="text"
            id="busquedaInput"
            placeholder="¿Qué estás buscando?"
        >

        <button
            id="botonBuscar"
            onclick="buscarConIA()"
        >

            Buscar

        </button>

    </div>


    <div id="status"></div>


    <div id="resultados"></div>



<script>


const inputBusqueda =
    document.getElementById("busquedaInput");


const resultadosDiv =
    document.getElementById("resultados");


const statusDiv =
    document.getElementById("status");


const botonBuscar =
    document.getElementById("botonBuscar");



// ======================================================
// BUSCAR AL PRESIONAR ENTER
// ======================================================

inputBusqueda.addEventListener(

    "keydown",

    function(event) {

        if (event.key === "Enter") {

            buscarConIA();

        }

    }

);



// ======================================================
// MOSTRAR ESTADO
// ======================================================

function mostrarEstado(mensaje, tipo = "") {

    statusDiv.style.display = "block";

    statusDiv.className = tipo;

    statusDiv.innerText = mensaje;

}



// ======================================================
// FUNCIÓN PRINCIPAL
// ======================================================

async function buscarConIA() {


    const busqueda =
        inputBusqueda.value.trim();


    resultadosDiv.innerHTML = "";


    // ---------------------------------------------
    // VALIDAR CAMPO
    // ---------------------------------------------

    if (!busqueda) {

        mostrarEstado(
            "Escribe primero lo que deseas buscar.",
            "error"
        );

        return;
    }


    botonBuscar.disabled = true;

    botonBuscar.innerText = "Buscando...";


    mostrarEstado(
        "Consultando a Gemini..."
    );


    try {


        // ---------------------------------------------
        // PETICIÓN AL PHP
        // ---------------------------------------------

        const response = await fetch(

            "./filtrar.php",

            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    busqueda: busqueda

                })

            }

        );



        // ---------------------------------------------
        // RECIBIR RESPUESTA COMO TEXTO PRIMERO
        // ---------------------------------------------

        const textoRespuesta =
            await response.text();



        // ---------------------------------------------
        // INTENTAR CONVERTIR A JSON
        // ---------------------------------------------

        let data;


        try {

            data = JSON.parse(textoRespuesta);

        }

        catch (error) {

            console.error(
                "Respuesta PHP:",
                textoRespuesta
            );


            mostrarEstado(

                "PHP respondió algo que no es JSON.\n\n" +

                "Respuesta del servidor:\n" +

                textoRespuesta,

                "error"

            );


            return;

        }



        // ---------------------------------------------
        // ERROR HTTP
        // ---------------------------------------------

        if (!response.ok) {


            let mensaje =

                "Error del servidor PHP (" +

                response.status +

                ")";


            if (data.error) {

                mensaje +=
                    "\n\n" + data.error;

            }


            if (data.detalle) {

                mensaje +=
                    "\n\nDetalle:\n" +
                    data.detalle;

            }


            mostrarEstado(
                mensaje,
                "error"
            );


            console.error(
                "Error servidor:",
                data
            );


            return;
        }



        // ---------------------------------------------
        // ERROR PERSONALIZADO DEL PHP
        // ---------------------------------------------

        if (data.error) {

            mostrarEstado(

                "Error:\n" +
                data.error,

                "error"

            );

            return;

        }



        // ---------------------------------------------
        // MOSTRAR FILTROS DE GEMINI
        // ---------------------------------------------

        const filtros =
            data.filtrosAplicados || {};


        mostrarEstado(

            "✅ Gemini entendió la búsqueda correctamente.\n\n" +

            "Categoría: " +
            (filtros.categoria || "No especificada") +

            "\nColor: " +
            (filtros.color || "No especificado") +

            "\nPrecio máximo: " +
            (
                filtros.precio_maximo > 0
                ? "$" + filtros.precio_maximo
                : "No especificado"
            ),

            "exito"

        );



        // ---------------------------------------------
        // SIN RESULTADOS
        // ---------------------------------------------

        if (
            !data.productos ||
            data.productos.length === 0
        ) {


            resultadosDiv.innerHTML = `

                <div class="sin-resultados">

                    <b>No se encontraron productos.</b>

                    <p>

                        Gemini entendió los filtros,
                        pero ningún producto del inventario
                        coincide con ellos.

                    </p>

                </div>

            `;


            return;

        }



        // ---------------------------------------------
        // MOSTRAR PRODUCTOS
        // ---------------------------------------------

        data.productos.forEach(

            function(prod) {


                const div =
                    document.createElement("div");


                div.className =
                    "producto";


                div.innerHTML = `

                    <h3>
                        ${escapeHTML(prod.nombre)}
                    </h3>

                    <p>
                        <b>Categoría:</b>
                        ${escapeHTML(prod.categoria)}
                    </p>

                    <p>
                        <b>Precio:</b>
                        $${Number(prod.precio)}
                    </p>

                    <p>
                        <b>Color:</b>
                        ${escapeHTML(prod.color)}
                    </p>

                `;


                resultadosDiv.appendChild(div);

            }

        );


    }

    catch (error) {


        console.error(
            "Error de conexión:",
            error
        );


        mostrarEstado(

            "No se pudo conectar con filtrar.php.\n\n" +

            "Posibles causas:\n" +

            "• Apache no está iniciado.\n" +

            "• Abriste index.html directamente con file://.\n" +

            "• filtrar.php no está en la misma carpeta.\n" +

            "• PHP no está funcionando.\n\n" +

            "Error técnico:\n" +

            error.message,

            "error"

        );

    }

    finally {


        botonBuscar.disabled = false;

        botonBuscar.innerText = "Buscar";

    }

}



// ======================================================
// SEGURIDAD AL MOSTRAR TEXTO
// ======================================================

function escapeHTML(texto) {


    const div =
        document.createElement("div");


    div.textContent =
        String(texto ?? "");


    return div.innerHTML;

}


</script>


</body>

</html>
