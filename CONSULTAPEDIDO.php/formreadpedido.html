<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ver Pedido</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:
    linear-gradient(rgba(0,0,0,0.30), rgba(0,0,0,0.30)),
    url('../imagenes/fondote.png');

    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.contenedor{
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(10px);
    padding:50px;
    width:520px;
    border-radius:30px;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#bf7485;
    margin-bottom:15px;
    font-size:32px;
}

.descripcion{
    text-align:center;
    color:#777;
    font-size:16px;
    margin-bottom:30px;
}

label{
    display:block;
    margin-bottom:10px;
    color:#666;
    font-weight:600;
    font-size:16px;
}

input[type="number"]{
    width:100%;
    padding:15px 18px;
    border:2px solid #f0d6dc;
    border-radius:15px;
    outline:none;
    margin-bottom:22px;
    transition:.3s;
    font-size:16px;
    text-align:center;
}

input[type="number"]:focus{
    border-color:#c96f84;
    box-shadow:0 0 10px rgba(201,111,132,.25);
}

input[type="number"]::placeholder{
    color:#aaa;
}

input[type="submit"]{
    width:100%;
    background:#c96f84;
    color:white;
    border:none;
    padding:16px;
    border-radius:50px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 8px 20px rgba(201,111,132,.35);
}

input[type="submit"]:hover{
    background:#b45d72;
    transform:translateY(-3px);
}

.error{
    color:#d85a5a;
    font-size:13px;
    margin-bottom:10px;
}

</style>

</head>

<body>

<div class="contenedor">

    <h2>VER PEDIDO</h2>

    <p class="descripcion">
        Ingresa el número de tu pedido para consultar su estado.
    </p>

    <form id="formEstado" action="estadopedido.php" method="POST">

        <label>Ingresa el número de tu pedido</label>

        <input 
            type="number" 
            name="idPedido"
            placeholder="Número de pedido"
        >

        <input 
            type="submit" 
            value="Ver pedido"
        >

    </form>

</div>

<script>

$(document).ready(function () {

    $("#formEstado").validate({

        rules: {
            idPedido: {
                required: true,
                min: 1,
                digits: true
            }
        },

        messages: {
            idPedido: {
                required: "Ingresa el número de tu pedido",
                min: "El número debe ser mayor a 0",
                digits: "Solo se permiten números enteros"
            }
        }

    });

});

</script>

</body>
</html>
